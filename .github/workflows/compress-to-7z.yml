name: Download Hashcat & John the Ripper into src/, then create 7z archive

on:
  workflow_dispatch: # manual trigger
  push:
    branches:
      - github_actions_without_conflicts
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full curl git build-essential

      - name: Download Hashcat v7.1.2
        run: |
          curl -L "https://github.com/hashcat/hashcat/releases/download/v7.1.2/hashcat-7.1.2.7z" -o hashcat.7z
          mkdir -p src
          7z x hashcat.7z -o./src/
          mv ./src/hashcat-7.1.2/* ./src/
          rm -r ./src/hashcat-7.1.2
          # Rename hashcat.bin -> hashcat (if it exists)
          if [ -f ./src/hashcat.bin ]; then
            mv ./src/hashcat.bin ./src/hashcat
            ln -sf process.sh hashcat.bin
          fi

      - name: Clone and Build John the Ripper
        run: |
          mkdir -p src
          git clone https://github.com/openwall/john.git ./src/john
          cd ./src/john
          git checkout 53674043c9cf4ece82a649e4f5834fd52f602935
          # Build John the Ripper (example for Linux)
          cd src
          ./configure
          make -s clean && make -s

      - name: Create 7z archive of src/
        run: |
          mkdir -p output
          7z a output/Hashtopolis-JtR-shim-agent.7z ./src/* -snl *

      - name: Create GitHub Release
        id: create_release
        run: |
          RELEASE_NAME="Hashtopolis-JtR-shim-agent-${{ github.sha }}"
          RELEASE_TAG="${{ github.sha }}"
          BODY="Release created by GitHub Actions"
          
          # Create a release
          RESPONSE=$(curl -s -X POST \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Content-Type: application/json" \
          -d '{"tag_name": "'"${RELEASE_TAG}"'", "name": "'"${RELEASE_NAME}"'", "body": "'"${BODY}"'", "draft": false, "prerelease": false}' \
          https://api.github.com/repos/${{ github.repository }}/releases)
          
          echo "::set-output name=release_id::$(echo $RESPONSE | jq .id)"

      - name: Upload .7z as release asset
        run: |
          RELEASE_ID=${{ steps.create_release.outputs.release_id }}
          echo "Uploading release asset..."
          
          # Upload the .7z file to the release
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/zip" \
            --data-binary @output/Hashtopolis-JtR-shim-agent-${{ github.sha }}.7z \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=Hashtopolis-JtR-shim-agent-${{ github.sha }}.7z"
